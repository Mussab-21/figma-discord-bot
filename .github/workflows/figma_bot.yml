name: Figma Discord Bot

on:
  schedule:
    - cron: '*/3 * * * *' # Runs every 3 minutes
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit state.json back

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Figma Discord Bot
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node figma_discord_bot.js

      - name: Commit and push updated state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Check if the file exists before trying to add and commit it
          if [ -f state.json ]; then
            git add state.json
            git commit -m "chore: update state.json" || exit 0
            git push origin HEAD:main
          else
            echo "state.json not found. Skipping commit."
          fi
