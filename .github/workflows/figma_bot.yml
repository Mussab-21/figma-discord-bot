name: Figma Discord Bot

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes to prevent rate limits
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Figma Discord Bot
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node figma_discord_bot.js

      - name: Commit and push updated state
        if: always() # Runs even if the previous step fails
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ -f state.json ]; then
            git add state.json
            if git diff --staged --quiet; then
              echo "No changes to state.json"
            else
              git commit -m "chore: update state.json"
              git push origin HEAD:main
            fi
          else
            echo "state.json does not exist. Skipping commit."
          fi
